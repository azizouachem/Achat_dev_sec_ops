version: '3.8'

services:
  achat-app:
    image: achat-app:${DOCKER_TAG:-latest}
    container_name: achat-app
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://achat-mysql:3306/achatdb?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - devops-net

networks:
  devops-net:
    name: achat_devops-net
    external: true
